name: MONAT stock monitor (todos los mercados)

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 12:00 UTC = 7:00 a. m. Bogotá
  workflow_dispatch: {}     # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write           # para guardar state/ e historial/ en el repositorio

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Barrido de todos los mercados
        id: scan
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ASANA_PROJECT_GID: ${{ vars.ASANA_PROJECT_GID }}
          ASANA_PROJECT_NAME: MONAT SHOP STOCK   # proyecto donde se crean las tareas
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py

      - name: Guardar estado y reporte
        if: always()
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "stock-monitor-bot@users.noreply.github.com"
          git add state historial || true
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Barrido de stock $(date -u +%Y-%m-%d)"
            git push
          fi
